<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beer Tasting Note</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe5;color:#24211d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;padding:22px 14px 90px}h1{margin:0;font-size:30px}.sub{color:#766e64;font-size:13px;margin:7px 0 22px}.card{background:#fffdf9;border:1px solid #ddd4c7;border-radius:20px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.start{background:white;border:1px solid #ddd4c7;border-radius:17px;padding:18px 10px;min-height:105px;text-align:left}.start b{display:block;font-size:16px;margin:8px 0}.muted{font-size:12px;color:#766e64}.hidden{display:none}.field{margin:12px 0}label{display:block;font-size:12px;color:#766e64;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #ddd4c7;border-radius:13px;font:inherit;background:#fff}textarea{min-height:90px}.btn{border:1px solid #ddd4c7;border-radius:14px;padding:12px 14px;background:white;font-weight:700}.primary{background:#24211d;color:#fff;border-color:#24211d}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #ddd4c7;border-radius:999px;padding:9px 12px;background:white}.chip.on{background:#24211d;color:white}.ref{background:#fff7e7;border:1px solid #e5c987;border-radius:14px;padding:12px;margin:12px 0}.photo{width:100%;max-height:300px;object-fit:contain;border-radius:14px;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.footer{position:fixed;bottom:0;left:0;right:0;background:#faf7f1ee;border-top:1px solid #ddd4c7;padding:10px}.footer>div{max-width:760px;margin:auto;display:flex;gap:10px}.footer button{flex:1}.preview{white-space:pre-wrap;background:#27231f;color:#fff;padding:15px;border-radius:14px;line-height:1.6}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div style="font-size:11px;letter-spacing:.12em;color:#9a8d7c">WANGAN BREWING</div><h1>Beer Tasting Note</h1><div class="sub">写真・銘柄検索・手入力から、1杯の記録を残す。</div>
<section id="home" class="card"><h2>どうやって始めますか？</h2><div class="grid">
<button class="start" onclick="mode('photo')">📷<b>写真から開始</b><span class="muted">ラベルを撮影／写真を選択</span></button>
<button class="start" onclick="mode('search')">🔍<b>銘柄を検索</b><span class="muted">代表銘柄から自動入力</span></button>
<button class="start" onclick="start()">✏️<b>手入力</b><span class="muted">自由に入力</span></button></div>
<div id="photo" class="hidden"><div class="field"><label>カメラで撮る</label><input id="camera" type="file" accept="image/*" capture="environment"></div><div class="field"><label>写真ライブラリから選ぶ</label><input id="library" type="file" accept="image/*"></div><img id="pic" class="photo hidden"><button id="photoGo" class="btn primary hidden" onclick="start()">この写真で開始</button></div>
<div id="search" class="hidden"><div class="field"><label>銘柄</label><input id="q" placeholder="Saison, Orval, Urquell..." oninput="catalog()"></div><div id="results"></div></div>
</section>
<section id="form" class="hidden">
<div class="card"><h2>ビール情報</h2><img id="recordPic" class="photo hidden"><div class="field"><label>銘柄名</label><input id="name"></div><div class="field"><label>ブルワリー</label><input id="brewery"></div><div class="field"><label>スタイル</label><input id="style"></div><div class="field"><label>ABV %</label><input id="abv" inputmode="decimal"></div><div id="reference" class="ref hidden"></div></div>
<div class="card"><h2>アロマ</h2><div class="muted">感じたものを選択</div><div id="aroma" class="chips"></div></div>
<div class="card"><h2>フレーバー</h2><div id="flavor" class="chips"></div></div>
<div class="card"><h2>バランス・口当たり</h2><div class="field"><label>ボディ</label><div id="body" class="chips"></div></div><div class="field"><label>炭酸</label><div id="carb" class="chips"></div></div><div class="field"><label>メモ</label><textarea id="memo"></textarea></div></div>
<div class="card"><h2>テイスティングノート</h2><div id="preview" class="preview">入力するとここに表示されます。</div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="save()">保存</button><button class="btn" onclick="makePreview()">更新</button></div></div>
</section></div>
<div class="footer"><div><button class="btn" onclick="location.reload()">新規</button><button class="btn primary" onclick="makePreview()">ノート生成</button></div></div>
<script>
const beers=[
{name:"Saison Dupont",brewery:"Brasserie Dupont",style:"Saison",abv:"6.5",aroma:["胡椒","柑橘","洋梨","ハーブ","穀物"],flavor:["ドライ","胡椒","レモン","パン","ハーブ"]},
{name:"Pilsner Urquell",brewery:"Plzeňský Prazdroj",style:"Czech Premium Pale Lager",abv:"4.4",aroma:["パン","蜂蜜","ハーブ","花"],flavor:["パン","ハーブ","苦味"]},
{name:"Weihenstephaner Hefeweissbier",brewery:"Weihenstephan",style:"Weissbier",abv:"5.4",aroma:["バナナ","クローブ","パン"],flavor:["バナナ","クローブ","パン"]},
{name:"Orval",brewery:"Brasserie d’Orval",style:"Belgian Pale Ale / Brett",abv:"6.2",aroma:["胡椒","柑橘","ハーブ","ブレット","土"],flavor:["ドライ","柑橘","ハーブ","ブレット"]},
{name:"Duchesse de Bourgogne",brewery:"Brouwerij Verhaeghe",style:"Flanders Red Ale",abv:"6.2",aroma:["チェリー","プラム","樽","バニラ","酢酸"],flavor:["チェリー","赤果実","樽","ワイン様","酢酸"]}];
const aromas=["パン","穀物","トースト","キャラメル","蜂蜜","花","草","ハーブ","松","樹脂","柑橘","レモン","グレープフルーツ","オレンジ","マンゴー","トロピカル","バナナ","洋梨","りんご","桃","クローブ","胡椒","ブレット","土","チェリー","プラム","樽","バニラ","乳酸","酢酸"];
const flavors=["パン","穀物","トースト","カラメル","チョコレート","ハーブ","草","松","樹脂","柑橘","レモン","グレープフルーツ","オレンジ","トロピカル","バナナ","洋梨","クローブ","胡椒","ブレット","ドライ","甘味","苦味","乳酸","酢酸","赤果実","チェリー","プラム","樽","バニラ","ワイン様"];
let selected={aroma:[],flavor:[],body:[],carb:[]},photo="";
function mode(m){document.getElementById(m).classList.remove("hidden");if(m==="search")catalog()}
function start(){home.classList.add("hidden");form.classList.remove("hidden");window.scrollTo(0,0)}
function chips(id,arr,key,single=false){let e=document.getElementById(id);e.innerHTML=arr.map(x=>'<button class="chip" type="button">'+x+'</button>').join("");[...e.children].forEach(b=>b.onclick=()=>{if(single){selected[key]=[b.textContent];[...e.children].forEach(x=>x.classList.toggle("on",x===b))}else{b.classList.toggle("on");selected[key]=[...e.querySelectorAll(".on")].map(x=>x.textContent)};makePreview()})}
function catalog(){let s=(q.value||"").toLowerCase();let a=beers.filter(b=>!s||JSON.stringify(b).toLowerCase().includes(s));results.innerHTML=a.map((b,i)=>'<button class="btn" style="width:100%;margin:4px 0;text-align:left" onclick="pick(\''+b.name.replaceAll("'","\\'")+'\')"><b>'+b.name+'</b><br><span class="muted">'+b.brewery+' / '+b.style+' / '+b.abv+'%</span></button>').join("")}
function pick(n){let b=beers.find(x=>x.name===n);name.value=b.name;brewery.value=b.brewery;style.value=b.style;abv.value=b.abv;reference.classList.remove("hidden");reference.innerHTML="<b>教科書的に期待される要素</b><br>アロマ："+b.aroma.join("、")+"<br>フレーバー："+b.flavor.join("、");start()}
function file(e){let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{photo=x.target.result;pic.src=photo;pic.classList.remove("hidden");recordPic.src=photo;recordPic.classList.remove("hidden");photoGo.classList.remove("hidden")};r.readAsDataURL(f)}
camera.onchange=file;library.onchange=file;
function makePreview(){preview.textContent="【"+(name.value||"名称未入力")+"】\n"+[brewery.value,style.value].filter(Boolean).join(" / ")+"\nABV："+(abv.value||"-")+"%\n\nアロマ："+(selected.aroma.join("、")||"未記録")+"\nフレーバー："+(selected.flavor.join("、")||"未記録")+"\nボディ："+(selected.body[0]||"-")+" / 炭酸："+(selected.carb[0]||"-")+"\n"+(memo.value?"メモ："+memo.value:"")}
function save(){makePreview();let x=JSON.parse(localStorage.getItem("beerNotes")||"[]");x.unshift({date:new Date().toISOString(),name:name.value,brewery:brewery.value,style:style.value,abv:abv.value,selected,memo:memo.value,photo,preview:preview.textContent});try{localStorage.setItem("beerNotes",JSON.stringify(x.slice(0,50)));alert("保存しました")}catch(e){alert("写真容量が大きく保存できませんでした。ノート本文は利用できます。")}}
chips("aroma",aromas,"aroma");chips("flavor",flavors,"flavor");chips("body",["ライト","ミディアムライト","ミディアム","ミディアムフル","フル"],"body",true);chips("carb",["弱い","やや弱い","中程度","やや強い","強い"],"carb",true);
</script></body></html>
